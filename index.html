<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APEX FC // MMA Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">APEX</span><span class="brand-mark accent">FC</span>
    <span class="brand-tag">FIGHTING CHAMPIONSHIP</span>
  </div>
  <nav class="nav">
    <button class="nav-btn active" data-screen="home">DASHBOARD</button>
    <button class="nav-btn" data-screen="career">CAREER</button>
    <button class="nav-btn" data-screen="roster">ROSTER</button>
    <button class="nav-btn" data-screen="rankings">RANKINGS</button>
    <button class="nav-btn" data-screen="matchmaker">MATCHMAKER</button>
    <button class="nav-btn" data-screen="events">EVENTS</button>
    <button class="nav-btn" data-screen="testlab">TEST LAB</button>
    <a href="chess.html" class="nav-btn nav-btn-chess">♟ CHESS</a>
  </nav>
</header>

<main id="app"></main>

<footer class="bottombar">
  <span class="status-dot"></span>
  <span class="status-text">SYSTEM ONLINE</span>
  <span class="sep">//</span>
  <span class="status-text" id="rosterCount">— FIGHTERS LOADED</span>
</footer>

<!-- Templates -->
<template id="tpl-home">
  <section class="screen home">
    <div class="hero">
      <div class="hero-stripe"></div>
      <h1 class="hero-title">APEX FIGHTING CHAMPIONSHIP</h1>
      <p class="hero-sub">THE PREMIER GLOBAL MIXED MARTIAL ARTS PROMOTION</p>
      <div class="hero-meta">
        <div><span class="k">PRESIDENT</span><span class="v">YOU</span></div>
        <div><span class="k">DATE</span><span class="v" id="gameDate">JAN 2026</span></div>
        <div><span class="k">REVENUE</span><span class="v">$0</span></div>
      </div>
    </div>
    <div class="quicktiles">
      <button class="tile" data-screen="career">
        <span class="tile-num">01</span>
        <span class="tile-label">CAREER MODE</span>
        <span class="tile-desc">Create your fighter. Climb the rankings. Win the title.</span>
      </button>
      <button class="tile" data-screen="matchmaker">
        <span class="tile-num">02</span>
        <span class="tile-label">BOOK A FIGHT</span>
        <span class="tile-desc">Run a single matchup. Live broadcast.</span>
      </button>
      <button class="tile" data-screen="roster">
        <span class="tile-num">03</span>
        <span class="tile-label">VIEW ROSTER</span>
        <span class="tile-desc">All signed fighters across divisions.</span>
      </button>
      <button class="tile" data-screen="rankings">
        <span class="tile-num">04</span>
        <span class="tile-label">RANKINGS</span>
        <span class="tile-desc">Top 15 per division + P4P.</span>
      </button>
      <button class="tile" data-screen="testlab">
        <span class="tile-num">05</span>
        <span class="tile-label">TEST LAB</span>
        <span class="tile-desc">Run a matchup 1000 times. See the spread.</span>
      </button>
    </div>
  </section>
</template>

<script src="data/fighters.js?v=11"></script>
<script src="js/utils.js?v=11"></script>
<script src="js/fight-engine.js?v=11"></script>
<script src="js/fight-visual.js?v=11"></script>
<script src="js/fight-screen.js?v=11"></script>
<script src="js/roster.js?v=11"></script>
<script src="js/events.js?v=11"></script>
<script src="js/testlab.js?v=11"></script>
<script src="js/career.js?v=11"></script>
<script src="js/app.js?v=11"></script>

</body>
</html>
